<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi de commande — Cortex Play Store</title>
<meta name="description" content="Suivez votre commande Cortex Play en temps réel : entrez votre numéro de commande pour connaître le statut de livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gp-header-mount"></div>
<div id="gp-cart-mount"></div>
<main style="max-width:820px;margin:0 auto;padding:40px 28px 72px">
  <nav class="breadcrumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--text)">Suivi de commande</span></nav>
  <h1 class="clash reveal" style="font:600 42px/1.05 'Clash Display',sans-serif;letter-spacing:-.015em">Suivre ma commande</h1>
  <p class="reveal" style="font:400 16px/1.6 Inter;color:var(--text2);margin:12px 0 32px">Entrez votre numéro de commande (format GP-XXXXXX) reçu par e-mail.</p>

  <div class="reveal" style="display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap">
    <input id="track-input" class="form-input" placeholder="GP-123456" style="flex:1;min-width:200px;font-family:ui-monospace,monospace">
    <button onclick="trackOrder()" class="btn-primary">Suivre</button>
  </div>

  <div id="track-error" style="display:none;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err);font:500 14px Inter;margin-bottom:20px"></div>

  <div id="track-result" style="display:none"></div>

  <!-- Recent orders shortcut -->
  <div id="recent-orders" style="margin-top:16px"></div>
</main>
<div id="gp-footer-mount"></div>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script>
function trackOrder(){
  const no=(document.getElementById('track-input').value||'').trim().toUpperCase();
  const err=document.getElementById('track-error');
  const res=document.getElementById('track-result');
  err.style.display='none'; res.style.display='none';
  if(!no){ err.textContent='Veuillez entrer un numéro de commande.'; err.style.display='block'; return; }
  const order=dbGetOrders().find(o=>o.id===no);
  if(!order){ err.textContent='Commande introuvable. Vérifiez le numéro ou consultez votre e-mail de confirmation.'; err.style.display='block'; return; }
  renderTracking(order);
}

function renderTracking(o){
  const res=document.getElementById('track-result');
  const total=o.subtotal-o.discount+o.shipping;
  const steps=['Commande confirmée','En préparation','Expédiée','En livraison','Livrée'];
  // Compute progress based on time elapsed (demo)
  const hrs=(Date.now()-new Date(o.date).getTime())/3.6e6;
  let current=0;
  if(hrs>0.1)current=1; if(hrs>2)current=2; if(hrs>12)current=3; if(hrs>36)current=4;
  const lines=(o.lines||[]).map(l=>'<div style="display:flex;justify-content:space-between;font:400 13.5px Inter;color:var(--text2);padding:6px 0"><span>'+l.qty+'× '+l.name+'</span><span class="num">'+(l.priceN*l.qty).toLocaleString('fr-FR')+' €</span></div>').join('');
  res.innerHTML='<div class="reveal in" style="border:1px solid var(--hair);border-radius:16px;background:var(--card);padding:32px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:8px"><div><div style="font:400 12px ui-monospace,monospace;color:var(--text2)">Commande</div><div class="clash" style="font:600 24px \'Clash Display\',sans-serif">'+o.id+'</div></div><span class="badge">'+steps[current]+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;position:relative;margin-bottom:32px">'+
      '<div style="position:absolute;top:14px;left:5%;right:5%;height:3px;background:var(--hair);z-index:0"></div>'+
      '<div style="position:absolute;top:14px;left:5%;height:3px;background:var(--cta-bg);z-index:1;width:calc('+(current/(steps.length-1)*90)+'%);transition:width 1s"></div>'+
      steps.map((s,i)=>'<div style="position:relative;z-index:2;text-align:center;flex:1"><div style="width:30px;height:30px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:'+(i<=current?'var(--cta-bg)':'var(--elev)')+';border:2px solid '+(i<=current?'var(--cta-bg)':'var(--hair)')+';color:'+(i<=current?'var(--cta-fg)':'var(--text2)')+';font:600 13px Inter">'+(i<current?'✓':(i+1))+'</div><div style="font:500 10.5px Inter;color:'+(i<=current?'var(--text)':'var(--text2)')+';margin-top:8px;max-width:70px;margin-left:auto;margin-right:auto">'+s+'</div></div>').join('')+
    '</div>'+
    '<div style="border-top:1px solid var(--hair);padding-top:20px">'+lines+
    '<div style="display:flex;justify-content:space-between;font:600 15px Inter;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)"><span>Total</span><span class="clash num" style="font:600 20px \'Clash Display\',sans-serif">'+total.toLocaleString('fr-FR')+' €</span></div></div>'+
    '<p style="font:400 13px/1.6 Inter;color:var(--text2);margin-top:20px">Livraison estimée sous 24-48h. Vous recevrez un e-mail et un SMS à chaque étape.</p>'+
  '</div>';
  res.style.display='block';
}

document.addEventListener('DOMContentLoaded',()=>{
  const orders=dbGetOrders();
  if(orders.length>0){
    document.getElementById('recent-orders').innerHTML='<div style="font:600 13px Inter;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px">Vos commandes récentes</div>'+
      orders.slice(0,3).map(o=>'<button onclick="document.getElementById(\'track-input\').value=\''+o.id+'\';trackOrder()" style="display:block;width:100%;text-align:left;border:1px solid var(--hair);border-radius:10px;background:var(--card);padding:14px 16px;margin-bottom:8px;cursor:pointer;color:var(--text);font:500 14px Inter"><span class="clash">'+o.id+'</span> <span style="color:var(--text2);font-weight:400">· '+new Date(o.date).toLocaleDateString('fr-FR')+'</span></button>').join('');
  }
});
</script>
</body></html>
